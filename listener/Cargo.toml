[package]
name = "listener"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# Where the signature lives inside launcher.exe. Zero dependencies of its own.
sigblock = { path = "../sigblock" }

# Log timestamps and rotation, UTF-16 for the Win32 calls below, and the x.y.z
# parser — all of it shared with the launcher and the installer.
common = { path = "../common" }

# Whether that signature makes a binary safe to run. Shared with the installer,
# which needs the same answer and used to reach a different one. It pulls in
# minisign-verify (verify-only on purpose: nothing that ships has any business
# being able to sign, and the signing half — scrypt, key handling — is weight it
# would carry for nothing; that lives in xtask, which is never shipped).
trust = { path = "../trust" }

# `toml` used to be here for the retired `.cartridge` marker and this crate's
# own config.toml. Both are gone — trust is compiled in (see build.rs) and
# nothing is read from disk but the launcher itself — so on a non-Windows build
# the crates above are the entire dependency tree.

# Windows-only: the resident trigger is entirely Win32. Nothing here is pulled
# in on a Linux build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    # WNDCLASSW carries an HBRUSH, so the struct itself is gated on Gdi even
    # though this window never paints.
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",              # GetLogicalDrives / GetDriveTypeW
    "Win32_System_Console",                  # AttachConsole, so --version prints
    "Win32_System_Diagnostics_Debug",        # SetErrorMode
    "Win32_System_LibraryLoader",            # GetModuleHandleW
    "Win32_System_Threading",                # CreateMutexW
    "Win32_System_WindowsProgramming",       # DRIVE_* constants
    "Win32_UI_WindowsAndMessaging",          # the message loop, and MessageBoxW
    "Win32_UI_Shell",                        # Shell_NotifyIconW, the tray icon
] }

# Compiles the tray icon and version info (FileDescription etc.) into the exe.
# Windows-only for the same reason the dependency above is: nothing here has
# any bearing on a Linux build.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
