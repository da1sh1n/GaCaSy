<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cartridge Launcher</title>
<style>
  :root {
    color-scheme: dark;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  #close-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: #999999;
    font-size: 1rem;
    line-height: 28px;
    cursor: pointer;
    z-index: 10;
  }

  #close-btn:hover {
    background: #b0202f;
    color: #ffffff;
  }

  #grid {
    display: flex;
    gap: 32px;
    padding: 0 40px;
  }

  .card {
    appearance: none;
    border: none;
    background: none;
    padding: 0;
    width: 200px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s ease;
  }

  .card:hover,
  .card:focus-visible {
    transform: translateY(-6px);
  }

  .card:focus-visible {
    outline: 2px solid #6ea8ff;
    outline-offset: 4px;
    border-radius: 16px;
  }

  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 600 / 900;
    object-fit: cover;
    border-radius: 14px;
    background: #151515;
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.55);
  }

  .card .caption {
    display: block;
    margin-top: 10px;
    height: 20px;
    line-height: 20px;
    color: #cfcfcf;
    font-size: 0.85rem;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <button id="close-btn" title="Close" onclick="window.ipc.postMessage('close')">&#10005;</button>
  <div id="grid"></div>

  <script>
    const games = window.__GAMES__ || [];
    const showCaptions = window.__SHOW_CAPTIONS__ === true;
    const grid = document.getElementById("grid");

    games.forEach((game, index) => {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.title = game.name;
      card.addEventListener("click", () => {
        window.ipc.postMessage("launch:" + index);
      });

      const img = document.createElement("img");
      img.src = game.image;
      img.alt = game.name;
      card.appendChild(img);

      if (showCaptions) {
        const caption = document.createElement("span");
        caption.className = "caption";
        caption.textContent = game.name;
        card.appendChild(caption);
      }

      grid.appendChild(card);
    });
  </script>
</body>
</html>
