# Cartridge Launcher config.
#
#   *_color                            hex, #rrggbb or #rrggbbaa
#   *_gap, *_size, *_width, *_radius   pixels
#   *_dim, *_opacity                   0 to 1
#
# A blank color is derived from the palette. Bad or missing values fall back to the default.

# Show the selected game's name on one line under the row.
show_captions = true

# Space from the window edge to the covers (42 or more), and between covers.
border_gap = 56
image_gap = 32

# 0 = square. The window's is ignored on Windows 11, which rounds its own.
corner_radius = 14
window_corner_radius = 12

# Everything that isn't cover art is one of these or derived from it.
#   primary    60%  the window behind everything
#   secondary  30%  cover shadows, control outlines, missing-art plate
#   accent     10%  text, the selected cover, the close button
primary_color = "#191325"
secondary_color = "#3D1F37"
accent_color = "#925E37"

# How far the cover shadow reaches, and how much of it is solid before it fades.
shadow_size = 28
shadow_fade = 2

# Toolbar text and outlines; the scroll bar under a too-long row.
toolbar_color = ""
scrollbar_color = ""

# The cursor ring. Blank switches white/black against the art under it.
cursor_color = ""

#   simple     nothing moves
#   particles  glowing hexagons spiraling out from the center
#   fog        soft plumes drifting upward
background_effect = "particles"
background_effect_color = ""

# The covers you aren't pointing at. 1 = solid.
cover_opacity = 0.9

# Screen dimming while a game starts.
overlay_color = "#00000045"

# The progress line under a starting cover, the status text below it, and the
# gap between the two.
loading_ring_color = ""
loading_text_color = ""
loading_text_gap = 12

# A cover that was chosen but failed to start.
error_border_color = "#e0b13a"
error_border_width = 3
error_text_color = "#e0b13a"

# A game whose exe isn't on the cartridge. 1 = untouched.
missing_sign_color = "#d13a3a"
missing_dim = 0.45

# The console window a console-mode game would open.
show_console_window = false

# How the covers are ordered; anything else falls back to "usage".
#   "usage"      — most recently played first, from usage_order
#   "alphabetic" — by name, A→Z
#   "catalog"    — the order they appear in catalog.json
#   "user"       — the order in user_order
order_mode = "usage"

# catalog.json indices. usage_order is launcher-written; user_order is yours.
usage_order = []
user_order = []
