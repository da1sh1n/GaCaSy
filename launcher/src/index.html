<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cartridge Launcher</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Everything in one row, close button included. It used to be fixed to the
       window corner, outside this bar, which cost #search a margin to clear it
       and made the corner the only part of the window not on a grid. -->
  <div id="toolbar">
    <div id="toolbar-left">
      <!-- A real control rather than a <select>. The native popup is drawn by
           Windows, not by this page: it arrives with its own font, its own
           metrics and its own corner radius in the middle of a window that has
           otherwise been drawn from scratch, and it was the single loudest
           "this is a web page" moment in the product.

           Four equal-width segments, so the pill that marks the active one is
           one fixed size and only ever moves — see #mode-pill in style.css. -->
      <div id="mode" role="radiogroup" aria-label="How the covers are ordered">
        <span id="mode-pill" aria-hidden="true"></span>
        <button type="button" role="radio" data-mode="usage" aria-checked="true">Recent</button>
        <button type="button" role="radio" data-mode="alphabetic" aria-checked="false">A-Z</button>
        <button type="button" role="radio" data-mode="catalog" aria-checked="false">Cartridge</button>
        <button type="button" role="radio" data-mode="user" aria-checked="false">Custom</button>
      </div>
      <button id="arrange" type="button" aria-pressed="false" title="Arrange the covers by hand">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <circle cx="3.5" cy="2" r="1.15" /><circle cx="8.5" cy="2" r="1.15" />
          <circle cx="3.5" cy="6" r="1.15" /><circle cx="8.5" cy="6" r="1.15" />
          <circle cx="3.5" cy="10" r="1.15" /><circle cx="8.5" cy="10" r="1.15" />
        </svg>
      </button>
    </div>
    <div id="toolbar-right">
      <input id="search" type="search" placeholder="Search" aria-label="Search games" />
      <button id="close-btn" type="button" title="Close" onclick="window.ipc.postMessage('close')">&#10005;</button>
    </div>
  </div>

  <!-- The moving background, behind everything. Empty here: the canvas is made
       and appended by backdrop.js, so a cartridge set to "simple" gets no
       canvas, no sprites and no animation loop at all. -->
  <div id="backdrop" aria-hidden="true"></div>

  <!-- The one box the layout is built around: the cover row, one border gap
       from every window edge. Everything else that is drawn — the toolbar
       above, the name line and the scroll bar below — sits inside those margins
       rather than taking room from this. -->
  <div id="stage">
    <div id="gallery"><div id="grid"></div></div>
    <!-- Shown in place of the gallery when the catalog is empty. Hidden by
         default: the common case is a cartridge with games, and a message that
         flashes before the covers appear would read as an error that wasn't one.

         Three empty plates at the real cover size rather than a line of text in
         the middle of a void — an empty shelf should look like an empty shelf,
         which says "nothing has been put here yet" where bare text reads as a
         page that failed to load. Sized by layout(), from the same numbers the
         covers would have used. -->
    <div id="empty">
      <div id="empty-plates" aria-hidden="true">
        <span class="plate"></span><span class="plate"></span><span class="plate"></span>
      </div>
      <p id="empty-message">No games on this cartridge</p>
    </div>
  </div>
  <!-- One cover, cloned per game by cards.js. Markup belongs here rather than
       in a dozen createElement calls; the grip is only visible while
       arranging. -->
  <template id="card-template">
    <button class="card" type="button">
      <span class="cover">
        <img alt="" />
        <!-- The sign and the message, as one centred stack ON the art. The
             message used to hang below the cover, where the row's own clipping
             sheared it and it collided with the name line. -->
        <span class="mark">
          <span class="sign"></span>
          <span class="note"></span>
        </span>
        <span class="grip">
          <svg width="18" height="4" viewBox="0 0 18 4" aria-hidden="true">
            <circle cx="2" cy="2" r="1.6" /><circle cx="9" cy="2" r="1.6" />
            <circle cx="16" cy="2" r="1.6" />
          </svg>
        </span>
      </span>
    </button>
  </template>
  <!-- The selected game's name, on one shared line in the bottom margin — not a
       label per cover. Thirty names under thirty covers is noise, and the only
       one worth reading is the one being pointed at. Living in the margin
       rather than in the stage is what keeps the cover row the same distance
       from the bottom of the window as from the top. -->
  <div id="nameplate"></div>

  <div id="scrollbar"><div id="scrollbar-thumb"></div></div>

  <div id="scrim"></div>
  <!-- Progress under the cover that's starting, rather than a ring floating in
       the middle of the screen. The track is set to the cover's exact width in
       JS and the segment sweeps inside it: one transform, no layout, no
       filter — which matters because this webview runs without the GPU. -->
  <div id="track" aria-hidden="true"><div id="track-run"></div></div>
  <div id="status" role="status"></div>

  <!-- A module, so the page script can be split by concern; app.js pulls the
       rest in. All of them are served over app:// the same way. -->
  <script type="module" src="app.js"></script>
</body>
</html>
