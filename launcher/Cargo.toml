[package]
name = "launcher"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# Reading this exe's own signature back out, for `--signature`. The signature
# itself is put there by `xtask sign` after linking; nothing at runtime writes
# one, and the launcher never verifies anybody — that is the listener's job.
sigblock = { path = "../sigblock" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rust-embed = { version = "8.5.0", features = ["include-exclude"] }
tao = "0.36.0"
toml = "1.1.4"
# `protocol` used to be here: 0.56.0 removed it and made `with_custom_protocol`
# (see src/ui.rs) always available, so there is no longer a feature to enable.
wry = "0.56.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }
