# Romzeta workspace — the three programs of the cartridge system, plus the two
# crates that serve them.
#
#   launcher/   runs on the cartridge and shows the games
#   listener/   runs on the PC and notices a cartridge being connected
#   installer/  the one file a user downloads; writes both of the above
#   sigblock/   the signature every one of them carries inside itself
#   trust/      whether a signature makes a binary safe to run, in one place
#   xtask/      builds and signs a release; never shipped
#
# The installer's build depends on the other two: it embeds their `--release`
# binaries, which it finds in this workspace's shared `target/release/`. That
# shared target directory is the reason the workspace exists — see
# installer/build.rs.
[workspace]
resolver = "3"
members = ["installer", "launcher", "listener", "sigblock", "trust", "xtask"]

# The version every program reports from `--version`, and the contract between
# them: two Romzeta programs are compatible when this number matches. `y` and `z`
# in each crate's own `x.y.z` are that crate's business — a launcher feature
# bumps only the launcher — but `x` moves for all of them at once, because it
# means "the way these programs talk to each other changed".
#
# The listener enforces it at runtime: it asks a verified launcher for its
# version and refuses to start one whose `x` differs from its own. `xtask
# release` enforces it at build time, refusing to ship a set of crates whose
# majors have drifted apart.
[workspace.metadata.romzeta]
project_version = 0

# The installer is deliberately NOT a default member, so the build happens in
# the order its payload requires:
#
#   cargo build --release              launcher + listener
#   cargo build --release -p installer embeds what the first step produced
#
# In one `--build the whole workspace` invocation cargo is free to run the
# installer's build script while `launcher.exe` is still being linked, since
# there is no dependency edge between them to order it (binary-artifact
# dependencies are still unstable). Leaving it out of the default set makes the
# correct order the natural one instead of a race that usually goes your way.
#
# xtask is out for a different reason: it is a build tool, not a product, and
# nothing it depends on should ever end up linked into something we ship. It
# still runs from anywhere in the workspace as `cargo run -p xtask -- …`.
# sigblock and trust are in, because both shipped programs link them.
default-members = ["launcher", "listener", "sigblock", "trust"]

# What ships. Cargo's stock `release` profile optimizes each crate on its own
# and then links the pieces, which for a GUI binary leaves a lot of code nothing
# ever calls — the installer statically links all of egui and its GL backend,
# and the installer is the one file a user downloads over a home connection, so
# its size is a feature.
[profile.release]
# Optimize for size rather than speed. None of these three programs has any
# throughput to lose: the installer is a wizard redrawing a static screen, the
# listener sleeps until a drive appears, and the launcher is a webview. What they
# do have is a download, and `3` spends bytes on unrolling and inlining that
# nothing here can use.
opt-level = "s"
# Optimize across crate boundaries, not just within them. This is what lets the
# linker see that most of egui/glow is unreachable from this app and drop it.
lto = "fat"
# One codegen unit per crate graph, so LTO has the whole picture. Slower builds;
# this profile is only ever used by a release.
codegen-units = 1
# No unwind tables and no landing pads. Nothing here catches a panic — every
# program in the workspace treats one as a bug and dies — so the machinery to
# unwind past it is pure weight.
panic = "abort"
